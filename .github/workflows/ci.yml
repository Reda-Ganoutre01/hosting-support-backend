name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '23'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}